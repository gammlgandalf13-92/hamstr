name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # für das Veröffentlichen der APK als Release

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signaturschlüssel aus Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.HAMSTR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hamstr-release.jks"
            echo "HAMSTR_KEYSTORE=$RUNNER_TEMP/hamstr-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret HAMSTR_KEYSTORE_BASE64 fehlt – APK wird mit Testschlüssel signiert, Updates lassen sich dann nicht drüberinstallieren."
          fi

      - name: Tests und APK
        env:
          HAMSTR_KEYSTORE_PASSWORD: ${{ secrets.HAMSTR_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace testReleaseUnitTest assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/hamstr-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: hamstr-apk
          path: out/*.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hamstr 1.0.${{ github.run_number }}
          body: |
            APK herunterladen und auf dem Handy installieren.
            Commit: ${{ github.sha }}
          files: out/*.apk
          make_latest: true

      - name: Testbericht bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
