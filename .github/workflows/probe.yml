name: Marktguru-Test (temporär)
on:
  push:
    branches: [probe-mg]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prospekt-Aufbau
        run: |
          set +e
          UA="Hamstr/1.0 (Android; privat)"
          HTML=$(curl -s -m 20 -A "$UA" https://www.marktguru.de/)
          API=$(echo "$HTML" | grep -oP '"apiKey"\s*:\s*"\K[^"]+' | head -1)
          CLI=$(echo "$HTML" | grep -oP '"clientKey"\s*:\s*"\K[^"]+' | head -1)
          curl -s -m 20 -H "x-apikey: $API" -H "x-clientkey: $CLI" -A "$UA" "https://api.marktguru.de/api/v1/leaflets/6525892?as=web" -o /tmp/l.json
          curl -s -m 20 -A "$UA" "https://www.marktguru.de/offers/25652307" -o /tmp/p.html
          JS=$(grep -oE 'src="/offer[^"]+\.js"' /tmp/p.html | head -1 | sed 's/src="//;s/"$//')
          curl -s -m 20 -A "$UA" "https://www.marktguru.de$JS" -o /tmp/o.js
          H=(-H "x-apikey: $API" -H "x-clientkey: $CLI" -A "$UA")
          B=https://api.marktguru.de/api/v1
          for f in $(grep -oE 'src="/[a-z0-9.~-]+\.js"' /tmp/p.html | sed 's/src="//;s/"$//'); do curl -s -m 20 -A "$UA" "https://www.marktguru.de$f" >> /tmp/all.js; done
          timeout 120 python3 - <<'PY'
          import re,subprocess
          js=open('/tmp/o.js',encoding='utf-8',errors='ignore').read()+open('/tmp/all.js',encoding='utf-8',errors='ignore').read()
          # Webpack-Chunks nachladen (Definition des API-Clients steckt oft darin)
          chunks=set(re.findall(r'"(/?[a-z0-9]*\.?[0-9a-f]{20}\.chunk\.js)"',js))|set(re.findall(r'([0-9]{2,4}\.[0-9a-f]{20}\.js)',js))
          print('chunks', len(chunks))
          for c in list(chunks)[:80]:
              u='https://www.marktguru.de/'+c.lstrip('/')
              try: js+=subprocess.run(['curl','-s','-m','10',u],capture_output=True,text=True).stdout
              except Exception: pass
          for pat in [r'bestleaflet', r'best-leaflet', r'leaflets/best', r'/best']:
              for m in list(re.finditer(pat, js, re.I))[:6]:
                  print('==',pat, js[max(0,m.start()-160):m.start()+200].replace('\n',' '))
          PY
