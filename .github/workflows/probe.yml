name: Marktguru-Test (temporär)
on:
  push:
    branches: [probe-mg]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: kaufDA prüfen
        run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 14) Hamstr/1.0 (privat)"
          for u in "https://www.kaufda.de/Hassfurt/EDEKA-Frischemarkt/p-r292" "https://www.kaufda.de/Hassfurt/EDEKA/p-r292" "https://www.kaufda.de/Angebote/Hassfurt/EDEKA"; do
            echo; echo "== $u"
            curl -s -L -A "$UA" -o /tmp/k.html -w "HTTP %{http_code} %{size_download}B %{url_effective}\n" "$u"
            python3 - <<'PY'
          import re,json
          h=open('/tmp/k.html',encoding='utf-8',errors='ignore').read()
          m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',h,re.S)
          print('next_data:', bool(m), 'len', len(h))
          print('titles:', re.findall(r'<title>(.*?)</title>',h)[:1])
          if m:
              d=json.loads(m.group(1))
              s=json.dumps(d)
              print('keys', list(d.get('props',{}).get('pageProps',{}).keys())[:30])
              for k in ['offers','brochures','contents','products','publisher']:
                  print(k, s.count('"%s"'%k))
              # Beispiele für Angebote mit Preis
              for mm in list(re.finditer(r'"(name|title)":"([^"]{3,60})"[^{}]{0,200}?"price[a-zA-Z]*":\s*\{?[^}]{0,80}',s))[:8]:
                  print('  ', mm.group(0)[:200])
              apis=sorted(set(re.findall(r'https?://[a-z0-9.-]*(?:bonial|kaufda)[a-z0-9.-]*/[A-Za-z0-9/_.-]{3,60}',s)))
              print('apis', apis[:15])
          PY
          done
