name: Marktguru-Test (temporär)
on:
  push:
    branches: [probe-mg]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: bestleaflet prüfen
        run: |
          set +e
          UA="Hamstr/1.0 (Android; privat)"
          HTML=$(curl -s -m 20 -A "$UA" https://www.marktguru.de/)
          API=$(echo "$HTML" | grep -oP '"apiKey"\s*:\s*"\K[^"]+' | head -1)
          CLI=$(echo "$HTML" | grep -oP '"clientKey"\s*:\s*"\K[^"]+' | head -1)
          H=(-H "x-apikey: $API" -H "x-clientkey: $CLI" -A "$UA")
          B=https://api.marktguru.de/api/v1
          t() { echo; echo "== $1"; curl -s -m 20 "${H[@]}" "$1" -o /tmp/r -w "HTTP %{http_code} %{size_download}B\n"; head -c 400 /tmp/r; echo; }
          t "$B/offers/25652307/bestleaflet?zipCode=97539&latitude=50.016&longitude=10.47&as=mobiledetailed"
          t "$B/offers/25652307/bestleaflet?zipCode=97539&latitude=50.016&longitude=10.47&as=web"
          t "$B/offers/25652307/bestleaflet?zipCode=97539&as=web"
          curl -s -m 20 "${H[@]}" "$B/offers/25652307/references?as=mobile" -o /tmp/ref.json
          python3 -c "
          import json; r=json.load(open('/tmp/ref.json'))['references']
          print('refs', len(r), [x for x in r if x['leafletId']==6525892])"
