name: Marktguru-Test (temporär)
on:
  push:
    branches: [probe-mg]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: App-Links und Suche prüfen
        run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36"
          echo "== assetlinks.json (Domain → App-Pakete)"
          for d in www.rewe.de rewe.de shop.rewe.de www.lidl.de lidl.de www.aldi-sued.de aldi-sued.de www.kaufland.de filiale.kaufland.de www.penny.de penny.de www.netto-online.de netto-online.de www.edeka.de edeka.de www.norma-online.de; do
            code=$(curl -s -L -A "$UA" -o /tmp/a.json -w '%{http_code}' "https://$d/.well-known/assetlinks.json")
            pk=$(python3 -c "
          import json
          try:
              d=json.load(open('/tmp/a.json'))
              print(sorted({x['target'].get('package_name') for x in d if x.get('target',{}).get('namespace')=='android_app'}))
          except Exception as e: print('kein JSON')")
            echo "$d: HTTP $code $pk"
          done
          echo; echo "== Suchseiten"
          for u in \
            "https://www.rewe.de/suche/?searchTerm=planted" "https://shop.rewe.de/productList?search=planted" "https://www.rewe.de/suche/?search=planted" \
            "https://www.lidl.de/q/search?q=planted" \
            "https://www.aldi-sued.de/de/suchergebnisse.html?search=planted" "https://www.aldi-sued.de/suche?q=planted" "https://www.aldi-sued.de/de/suche.html?q=planted" \
            "https://www.kaufland.de/s/?search_value=planted" "https://filiale.kaufland.de/suche.html?q=planted" \
            "https://www.penny.de/suche?query=planted" "https://www.penny.de/suche?q=planted" \
            "https://www.netto-online.de/search?q=planted" "https://www.netto-online.de/suche?q=planted" \
            "https://www.edeka.de/suche.jsp?query=planted" "https://www.norma-online.de/de/suche/?q=planted"; do
            r=$(curl -s -L -A "$UA" -o /tmp/s.html -w '%{http_code} %{url_effective}' "$u")
            n=$(grep -oi "planted" /tmp/s.html | wc -l)
            echo "$r  (planted ×$n, $(wc -c </tmp/s.html)B)"
          done
