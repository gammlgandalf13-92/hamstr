name: Marktguru-Test (temporär)
on:
  push:
    branches: [probe-mg]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Händlernamen prüfen
        run: |
          set +e
          UA="Hamstr/1.0 (Android; privat)"
          HTML=$(curl -s -A "$UA" https://www.marktguru.de/)
          API=$(echo "$HTML" | grep -oP '"apiKey"\s*:\s*"\K[^"]+' | head -1)
          CLI=$(echo "$HTML" | grep -oP '"clientKey"\s*:\s*"\K[^"]+' | head -1)
          H=(-H "x-apikey: $API" -H "x-clientkey: $CLI" -A "$UA")
          B=https://api.marktguru.de/api/v1
          for q in butter milch kaffee nudeln joghurt bier "edeka" "e center" "edeka center" "marktkauf" "norma" "edeka nordbayern" "e-center"; do
            curl -s "${H[@]}" "$B/offers/search?as=web&limit=100&offset=0&q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&zipCode=97539" -o /tmp/o.json
            python3 - "$q" <<'PY'
          import json,sys,collections
          d=json.load(open('/tmp/o.json'))
          r=d.get('results') or []
          ret=[(x.get('name'),x.get('resultsCount')) for x in ((d.get('filters') or {}).get('retailers') or [])]
          adv=collections.Counter((a.get('name'),a.get('uniqueName')) for x in r for a in (x.get('advertisers') or []))
          print(f"q={sys.argv[1]!r} total={d.get('totalResults')} retailers={ret}")
          print("   advertisers:", [k for k in adv if k[0] and ('ede' in k[0].lower() or 'center' in k[0].lower() or 'norma' in k[0].lower() or 'kauf' in k[0].lower())] or list(adv)[:6])
          if sys.argv[1]=='norma':
              for x in r[:3]: print('   norma-hit:', (x.get('product') or {}).get('name'), [a.get('name') for a in x.get('advertisers') or []], x.get('validityDates'))
          PY
          done
          echo "== Händlerseiten"
          for s in edeka e-center edeka-center norma marktkauf; do echo "$s: $(curl -s -o /dev/null -w '%{http_code}' -A "$UA" https://www.marktguru.de/r/$s)"; done
