name: Marktguru-Test (temporär)
on:
  push:
    branches: [probe-mg]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prospekt-Aufbau
        run: |
          set +e
          UA="Hamstr/1.0 (Android; privat)"
          HTML=$(curl -s -m 20 -A "$UA" https://www.marktguru.de/)
          API=$(echo "$HTML" | grep -oP '"apiKey"\s*:\s*"\K[^"]+' | head -1)
          CLI=$(echo "$HTML" | grep -oP '"clientKey"\s*:\s*"\K[^"]+' | head -1)
          curl -s -m 20 -H "x-apikey: $API" -H "x-clientkey: $CLI" -A "$UA" "https://api.marktguru.de/api/v1/leaflets/6525892?as=web" -o /tmp/l.json
          curl -s -m 20 -A "$UA" "https://www.marktguru.de/offers/25652307" -o /tmp/p.html
          JS=$(grep -oE 'src="/offer[^"]+\.js"' /tmp/p.html | head -1 | sed 's/src="//;s/"$//')
          curl -s -m 20 -A "$UA" "https://www.marktguru.de$JS" -o /tmp/o.js
          timeout 60 python3 - <<'PY'
          import json,re
          d=json.load(open('/tmp/l.json'))
          print('keys', sorted(d.keys()))
          for k,v in d.items():
              if isinstance(v,list) and v:
                  print('list', k, len(v), 'first:', json.dumps(v[0])[:600])
              elif isinstance(v,dict):
                  print('dict', k, json.dumps(v)[:200])
          s=json.dumps(d); print('25652307 in leaflet:', '25652307' in s)
          js=open('/tmp/o.js',encoding='utf-8',errors='ignore').read()
          i=js.find('pageflip,null!=o?o:{leafletId:i,pageIndex:0}')
          print('== JS vor pageflip:', js[max(0,i-900):i+60] if i>=0 else 'nicht gefunden')
          for m in sorted(set(re.findall(r'["`](/[a-z-]+/[^"`]{0,80}(?:leaflet|flight|page)[^"`]{0,60})["`]', js)))[:20]:
              print('path', m)
          PY
