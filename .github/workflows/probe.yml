name: Marktguru-Test (temporär)
on:
  push:
    branches: [probe-mg]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Prospekt-Felder prüfen
        run: |
          set +e
          UA="Hamstr/1.0 (Android; privat)"
          HTML=$(curl -s -A "$UA" https://www.marktguru.de/)
          API=$(echo "$HTML" | grep -oP '"apiKey"\s*:\s*"\K[^"]+' | head -1)
          CLI=$(echo "$HTML" | grep -oP '"clientKey"\s*:\s*"\K[^"]+' | head -1)
          curl -s -H "x-apikey: $API" -H "x-clientkey: $CLI" -A "$UA" "https://api.marktguru.de/api/v1/offers/search?as=web&limit=5&offset=0&q=planted&zipCode=97539" -o /tmp/o.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/o.json'))
          for r in d.get('results',[])[:3]:
              print('== offer', r.get('id'), (r.get('product') or {}).get('name'), [a.get('name') for a in r.get('advertisers') or []])
              print('   keys:', sorted(r.keys()))
              for k,v in r.items():
                  s=json.dumps(v)
                  if 'leaflet' in k.lower() or 'page' in k.lower() or 'flight' in k.lower() or 'leaflet' in s.lower():
                      print('  ', k, '=', s[:400])
          PY
          ID=$(python3 -c "import json;print(json.load(open('/tmp/o.json'))['results'][0]['id'])")
          echo "== Angebotsseite $ID"
          curl -s -A "$UA" "https://www.marktguru.de/offers/$ID" -o /tmp/p.html
          grep -oE '/leaflets/[0-9]+(/page/[0-9]+)?' /tmp/p.html | sort | uniq -c | head
          grep -oE '.{0,80}leaflet.{0,120}' /tmp/p.html | head -5
          echo "== Einzelangebot API"
          curl -s -H "x-apikey: $API" -H "x-clientkey: $CLI" -A "$UA" "https://api.marktguru.de/api/v1/offers/$ID?as=web" | head -c 1500; echo
