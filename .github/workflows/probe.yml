name: Marktguru-Test (temporär)
on:
  push:
    branches: [probe-mg]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Endpunkte prüfen
        run: |
          UA="Hamstr/1.0 (Android; privat)"
          HTML=$(curl -s -A "$UA" https://www.marktguru.de/r/rewe)
          API=$(echo "$HTML" | grep -oP '"apiKey"\s*:\s*"\K[^"]+' | head -1)
          CLI=$(echo "$HTML" | grep -oP '"clientKey"\s*:\s*"\K[^"]+' | head -1)
          echo "keys: ${#API} ${#CLI}"
          echo "== Seite /r/rewe: api-Pfade im HTML"
          echo "$HTML" | grep -oE 'api/v1/[A-Za-z0-9_/{}.-]+' | sort | uniq -c | head -40
          echo "== JS-Bundles"
          for js in $(echo "$HTML" | grep -oE 'src="[^"]+\.js"' | sed 's/src="//;s/"$//' | head -25); do
            case "$js" in http*) u="$js";; //*) u="https:$js";; *) u="https://www.marktguru.de$js";; esac
            curl -s -A "$UA" "$u" | grep -oE '(api/v1)?/(offers|retailers|leaflets|industries|advertisers)[A-Za-z0-9_/{}?=&.$-]*' | sort -u | head -30
          done | sort -u | head -80
          echo "== __NEXT_DATA__ / state keys"
          echo "$HTML" | grep -oE '"(retailerId|advertiserId|retailer|uniqueName|id)":[^,]{1,40}' | sort | uniq -c | sort -rn | head -20
          H=(-H "x-apikey: $API" -H "x-clientkey: $CLI" -A "$UA")
          try() { echo "== $1"; curl -s -o /tmp/o.json -w "HTTP %{http_code} %{size_download}B\n" "${H[@]}" "$1"; head -c 600 /tmp/o.json; echo; python3 -c "import json;d=json.load(open('/tmp/o.json'));print('keys',list(d.keys())[:10] if isinstance(d,dict) else type(d));r=d.get('results') if isinstance(d,dict) else None;print('results',len(r) if r else None,'total',d.get('totalResults') if isinstance(d,dict) else '')" 2>/dev/null; }
          B=https://api.marktguru.de/api/v1
          try "$B/offers/search?as=web&limit=20&offset=0&q=&zipCode=97539"
          try "$B/offers/search?as=web&limit=20&offset=0&q=rewe&zipCode=97539"
          try "$B/retailers/rewe/offers?as=web&limit=20&offset=0&zipCode=97539"
          try "$B/advertisers/rewe/offers?as=web&limit=20&offset=0&zipCode=97539"
          try "$B/offers?as=web&limit=20&offset=0&zipCode=97539&retailerUniqueName=rewe"
          try "$B/retailers/rewe?as=web&zipCode=97539"
          try "$B/industries/supermarkets/offers?as=web&limit=20&offset=0&zipCode=97539"
          try "$B/leaflets/search?as=web&limit=10&offset=0&zipCode=97539&q=rewe"
