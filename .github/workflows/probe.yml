name: Marktguru-Test (temporär)
on:
  push:
    branches: [probe-mg]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Händlernamen prüfen
        run: |
          set +e
          UA="Hamstr/1.0 (Android; privat)"
          HTML=$(curl -s -A "$UA" https://www.marktguru.de/)
          API=$(echo "$HTML" | grep -oP '"apiKey"\s*:\s*"\K[^"]+' | head -1)
          CLI=$(echo "$HTML" | grep -oP '"clientKey"\s*:\s*"\K[^"]+' | head -1)
          H=(-H "x-apikey: $API" -H "x-clientkey: $CLI" -A "$UA")
          B=https://api.marktguru.de/api/v1
          for z in 97539 97421 97070 96047 90402 80331 20095 50667 10115; do
            for q in edeka norma "edeka center" marktkauf penny kaufland; do
              curl -s "${H[@]}" "$B/offers/search?as=web&limit=100&offset=0&q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&zipCode=$z" -o /tmp/o.json
              python3 -c "
          import json,sys,collections
          d=json.load(open('/tmp/o.json')); r=d.get('results') or []
          adv=collections.Counter(a.get('name')+'|'+a.get('uniqueName','') for x in r for a in (x.get('advertisers') or []))
          print('$z', repr('$q'), d.get('totalResults'), dict(adv.most_common(3)))"
            done
          done
